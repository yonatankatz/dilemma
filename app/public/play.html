<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a0610">
<title>מה הייתם עושים?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2230%22 cy=%2250%22 r=%2228%22 fill=%22%23c8102e%22/%3E%3Ccircle cx=%2270%22 cy=%2250%22 r=%2228%22 fill=%22%23e8b64c%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/theme.css">
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { user-select: none; -webkit-user-select: none; }

  .screen {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    text-align: center;
    animation: screenIn .45s var(--ease-out) both;
  }
  .screen.leaving { animation: screenOut .25s ease-in both; pointer-events: none; }
  @keyframes screenIn { from { opacity: 0; transform: scale(.96) translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes screenOut { to { opacity: 0; transform: scale(1.03); } }

  /* ---------- vote ---------- */
  .vote { padding: 0; flex-direction: column; }
  @media (orientation: landscape) { .vote { flex-direction: row; } }
  .vote button {
    flex: 1; width: 100%; border: 0; margin: 0; padding: 0; cursor: pointer;
    font-family: var(--display); font-size: clamp(7rem, 34vmin, 18rem); line-height: 1;
    position: relative; overflow: hidden;
    transition: transform .12s var(--ease-out), filter .2s;
  }
  .vote button:active { transform: scale(.97); filter: brightness(1.1); }
  .vote .b1 { background: var(--opt1-grad); color: var(--cream); text-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .vote .b2 { background: var(--opt2-grad); color: var(--wine); text-shadow: 0 4px 18px rgba(255,255,255,.35); }
  .vote button span { display: inline-block; animation: popIn .5s var(--ease-back) both; }
  .vote .b2 span { animation-delay: .08s; }
  .vote .divider {
    position: absolute; inset: 50% 0 auto 0; height: 0; z-index: 2; pointer-events: none;
  }
  .vote .timer {
    position: absolute; top: 0; inset-inline: 0; height: 6px; z-index: 3;
    background: rgba(20,3,10,.35);
  }
  .vote .timer i {
    display: block; height: 100%; width: 100%; background: var(--cream);
    transform-origin: right; box-shadow: 0 0 10px rgba(246,232,204,.8);
  }
  .vote .timer.urgent i { background: #fff; animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* ---------- waiting ---------- */
  .wait .big { font-family: var(--display); font-size: clamp(2rem, 9vw, 3rem); line-height: 1.2; margin: 18px 0 8px; }
  .wait .sub { color: var(--muted); font-size: 1.15rem; max-width: 22em; line-height: 1.5; }
  .wait .chosen { width: 34vmin; height: 34vmin; max-width: 180px; max-height: 180px; font-size: clamp(4rem, 20vmin, 7rem); animation: popIn .6s var(--ease-back) both; }
  .dots { display: flex; gap: 10px; margin-top: 34px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-12px); opacity: 1; } }
  .emoji { font-size: 4.5rem; animation: popIn .6s var(--ease-back) both, pulse 2.4s 1s ease-in-out infinite; }

  /* ---------- join ---------- */
  .join { justify-content: flex-start; overflow-y: auto; padding-top: max(36px, env(safe-area-inset-top)); }
  .join h1 { font-family: var(--display); font-weight: 400; font-size: 2.2rem; margin: 6px 0 4px; }
  .join .note { color: var(--muted); margin: 0 0 22px; }
  .seg { width: 100%; max-width: 420px; margin-bottom: 22px; animation: fadeUp .5s var(--ease-out) both; }
  .seg h2 { font-size: 1.2rem; margin: 0 0 10px; color: var(--gold-hi); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .opts button {
    font: 700 1.1rem var(--body); padding: 14px 8px; border-radius: 14px; cursor: pointer;
    background: rgba(246,232,204,.08); color: var(--cream); border: 1.5px solid var(--line);
    transition: transform .15s var(--ease-back), background .2s, color .2s;
    unicode-bidi: plaintext;
  }
  .opts button.on { background: var(--gold-grad); color: var(--wine); border-color: transparent; transform: scale(1.04); }
  .join .go { margin-top: 8px; font-size: 1.3rem; padding: .8em 2.4em; }

  .toast {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); z-index: 10;
    transform: translate(-50%, 20px); opacity: 0; transition: .25s var(--ease-out);
    background: var(--ink); color: var(--cream); padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); font-weight: 700; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body class="stage">
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/js/play.js"></script>
</body>
</html>
