<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כניסה לניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2230%22 cy=%2250%22 r=%2228%22 fill=%22%23c8102e%22/%3E%3Ccircle cx=%2270%22 cy=%2250%22 r=%2228%22 fill=%22%23e8b64c%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/theme.css">
<style>
  body { background: var(--bg-grad) fixed, var(--wine); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card {
    width: min(380px, 100%); background: rgba(20, 3, 10, .6); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 22px; display: grid; gap: 14px; animation: fadeUp .5s var(--ease-out) both;
  }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0 0 4px; text-align: center; }
  label { display: grid; gap: 4px; font-weight: 700; font-size: .95rem; color: var(--muted); }
  input[type=text], input[type=password] {
    font: 600 1.05rem var(--body); color: var(--cream); background: rgba(20,3,10,.6);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; direction: ltr; text-align: right;
  }
  input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,182,76,.2); }
  .remember { display: flex; align-items: center; gap: 10px; color: var(--cream); font-weight: 600; cursor: pointer; }
  .remember input { width: 20px; height: 20px; accent-color: var(--gold); }
  .btn { width: 100%; font-size: 1.15rem; padding: 12px; }
  .err { color: #ff8a9b; font-weight: 700; min-height: 1.3em; text-align: center; margin: 0; }
  .card.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body>
<form class="card" id="form">
  <h1 class="gold-text">כניסה לניהול</h1>
  <label>שם משתמש<input type="text" name="user" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label>סיסמה<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <label class="remember"><input type="checkbox" name="remember" checked>זכור אותי במכשיר הזה</label>
  <button class="btn" type="submit">כניסה</button>
  <p class="err" id="err"></p>
</form>
<script src="/js/login.js"></script>
</body>
</html>
