<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>דילמה</title>
<style>
  :root {
    --one: #2563eb;
    --one-dark: #1e40af;
    --two: #e11d48;
    --two-dark: #9f1239;
    --text: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111827; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  @media (orientation: landscape) { main { flex-direction: row; } }
  button {
    flex: 1; border: 0; margin: 0; padding: 0;
    color: var(--text);
    font-size: clamp(6rem, 30vmin, 16rem);
    font-weight: 800; line-height: 1;
    cursor: pointer; position: relative;
    transition: filter .15s, transform .1s, opacity .2s;
    user-select: none;
  }
  button:active { transform: scale(.98); }
  #b1 { background: var(--one); }
  #b2 { background: var(--two); }
  main.voted button:not(.selected) { opacity: .45; filter: saturate(.6); }
  button.selected { box-shadow: inset 0 0 0 10px rgba(255,255,255,.85); }
  button .check {
    position: absolute; bottom: 14px; left: 0; right: 0;
    font-size: 1.15rem; font-weight: 600; opacity: 0; transition: opacity .2s;
  }
  button.selected .check { opacity: 1; }
  #toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
    background: rgba(17,24,39,.92); color: #fff; padding: 14px 22px; border-radius: 999px;
    font-size: 1.1rem; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<main id="main">
  <button id="b1" data-choice="1" aria-label="הצבעה 1">1<span class="check">✓ הצבעת 1</span></button>
  <button id="b2" data-choice="2" aria-label="הצבעה 2">2<span class="check">✓ הצבעת 2</span></button>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  const main = document.getElementById('main');
  const toast = document.getElementById('toast');
  let toastTimer;

  function show(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function render(choice) {
    main.classList.toggle('voted', !!choice);
    document.querySelectorAll('button').forEach(b => b.classList.toggle('selected', b.dataset.choice === choice));
  }

  async function vote(choice) {
    try {
      const r = await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ choice }),
        credentials: 'same-origin'
      });
      if (!r.ok) throw new Error();
      const data = await r.json();
      render(data.choice);
      if (navigator.vibrate) navigator.vibrate(30);
      show('ההצבעה נקלטה ✓');
    } catch {
      show('שגיאה, נסו שוב');
    }
  }

  document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => vote(b.dataset.choice)));

  fetch('/api/me', { credentials: 'same-origin' })
    .then(r => r.json()).then(d => render(d.choice)).catch(() => {});
</script>
</body>
</html>
